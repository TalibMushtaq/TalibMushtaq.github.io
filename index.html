    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <!-- Applied before the bundle loads so a dark-mode visitor never sees a white
         flash before Vue mounts. useTheme.js reads the same key afterwards. -->
    <script>
      try {
        var saved = localStorage.getItem("theme");
        if (
          saved === "dark" ||
          (!saved && matchMedia("(prefers-color-scheme: dark)").matches)
        ) {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
